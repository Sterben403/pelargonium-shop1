services:
  db:
    image: postgres:16-alpine
    container_name: pelargonium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pelargonium
      POSTGRES_PASSWORD: pelargonium
      POSTGRES_DB: pelargonium
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelargonium -d pelargonium"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Web viewer for the database: http://localhost:8081
  adminer:
    image: adminer:4
    container_name: pelargonium-adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "8081:8080"

  # The site itself in a container (demo stand): http://localhost:8020
  # Uptime Kuma checks it inside the Docker network at http://app:8000/api/health
  app:
    build: ./backend
    container_name: pelargonium-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://pelargonium:pelargonium@db:5432/pelargonium
      # smart search: Ollama runs on the host computer (AI_SEARCH_ENABLED=true docker compose up -d app)
      AI_SEARCH_ENABLED: ${AI_SEARCH_ENABLED:-false}
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8020:8000"  # reachable only from this computer

  # Availability monitoring of the demo stand: http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: pelargonium-uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  uptime:
